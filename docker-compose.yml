services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${PORT:-8001}:8001"
    # Agregamos esto para que el contenedor pueda ver tu localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"